name: Infrastructure

on:
  pull_request:
    paths:
      - "terraform/**"
      - "bootstrap/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "bootstrap/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.9.8

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform -chdir=terraform/envs/dev fmt -check -recursive
      - run: terraform -chdir=terraform/envs/dev init -backend=false
      - run: terraform -chdir=terraform/envs/dev validate

      - uses: terraform-linters/setup-tflint@v4.1.1
        with:
          tflint_version: v0.53.0

      - run: tflint --init
      - run: tflint --recursive

      - uses: bridgecrewio/checkov-action@v12.3057.0
        with:
          directory: terraform
          framework: terraform
          soft_fail: false

  plan:
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID>:role/gitops-eks-platform-github-plan
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform -chdir=terraform/envs/dev init
      - run: terraform -chdir=terraform/envs/dev plan -out=tfplan

      - name: Comment plan
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const body = [
              "### Terraform plan",
              "",
              "The Terraform plan job completed.",
              "",
              "See the workflow logs for the complete plan output."
            ].join("
");
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID>:role/gitops-eks-platform-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform -chdir=terraform/envs/prod init
      - run: terraform -chdir=terraform/envs/prod apply -auto-approve
