name: Application

on:
  push:
    branches: [main]
    paths:
      - "apps/sample-api/**"
      - "charts/sample-api/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "apps/sample-api/**"
      - "charts/sample-api/**"

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: gitops-eks-platform/sample-api

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r apps/sample-api/requirements.txt
            - name: Run tests
        working-directory: apps/sample-api
        run: pytest -q

  build-scan-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID>:role/gitops-eks-platform-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Build image
        run: |
          docker build             -t "${{ env.ECR_REPOSITORY }}:${{ github.sha }}"             apps/sample-api

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Push image
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          docker tag "${{ env.ECR_REPOSITORY }}:${{ github.sha }}"             "$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

      - name: Update dev GitOps tag
        run: |
          ./scripts/bump-image-tag.sh "${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/environments/dev/values-dev.yaml
          git commit -m "chore(gitops): promote sample-api ${{ github.sha }}" || exit 0
          git push
