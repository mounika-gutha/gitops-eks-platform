deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  limits_config:
    retention_period: 168h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi

gateway:
  enabled: true

monitoring:
  dashboards:
    enabled: true
  rules:
    enabled: true
