apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-opsgenie
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: alertmanager-opsgenie
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: gitops-eks-platform/opsgenie
        property: api-key
