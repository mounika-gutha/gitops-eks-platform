replicaCount: 2

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/gitops-eks-platform/sample-api
  tag: "REPLACE_WITH_IMAGE_SHA"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  hosts:
    - host: <DEV_API_HOST>
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
