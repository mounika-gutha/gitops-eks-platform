apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  source:
    repoURL: <GITOPS_REPO_URL>
    targetRevision: main
    path: charts/sample-api
    helm:
      valueFiles:
        - ../../gitops/environments/prod/values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-api-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
